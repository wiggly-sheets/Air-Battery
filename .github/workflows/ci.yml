name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' -print 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 27 installation on this runner"
            ls /Applications
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk"
          case "$sdk" in
            27.*) ;;
            *) echo "::error::the macOS 27 SDK is required, found $sdk"; exit 1 ;;
          esac
      - run: make test
      - run: make build
